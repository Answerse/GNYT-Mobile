<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>桂农易通 - 首页</title>
  <link rel="preload" href="assets/fonts/DINishCondensed-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/DINishCondensed-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/AlimamaShuHeiTi-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <!-- ============ 首页 ============ -->
  <div class="page" id="page-home">
  <!-- ============ 绿色渐变头图区（状态栏 + 导航 + 本月统计 + 插画） ============ -->
  <div class="hero-zone">
    <div class="hero-zone__inner">
      <!-- 顶栏（Header 组件：首页导航，含农户版/企业版切换按钮，由 PageHeader.mount 渲染） -->
      <div class="header-mount" data-header="home"></div>

      <!-- 农户版：本月统计（Figma 65:5095；切换企业版时隐藏） -->
      <div class="stat stat--farm">
        <div class="stat__label">本月总支出 <span class="stat__unit">(万元)</span></div>
        <div class="stat__value">2300.92</div>
        <div class="stat__pill"><span>本月共</span><strong>92</strong><span>单</span></div>
      </div>
      <!-- 企业版：头部无统计数字，仅插画（Figma 231:9724） -->
    </div>
    <!-- 农户版插画（Figma 65:5095） -->
    <img class="illus illus--farm" src="assets/images/illus-banner.webp" alt="" />
    <!-- 企业版插画（Figma 231:9724：增长卷轴 + 箭头 + 金币） -->
    <img class="illus illus--enterprise" src="assets/images/illus-enterprise.webp" alt="" hidden />
    <!-- 服务商版插画（基于企业版） -->
    <img class="illus illus--provider" src="assets/images/illus-enterprise.webp" alt="" hidden />
  </div>

  <main class="page">
    <!-- 桂农码大卡：深绿账户条 + 创建订单 + 功能入口 -->
    <section class="qr-card" aria-label="桂农码">
      <!-- 顶部深绿账户条 -->
      <div class="qr-card__user">
        <img class="qr-card__avatar" src="assets/icons/avatar.png" alt="头像" />
        <div class="qr-card__info">
          <div class="qr-card__name-row">
            <span class="qr-card__name">钱若霖</span>
            <span class="badge" data-badge="admin"></span>
          </div>
          <span class="qr-card__phone">153 **** 0312</span>
        </div>
        <img class="qr-card__corner" src="assets/icons/card-corner.svg" alt="" />
      </div>

      <!-- 白底主体 -->
      <div class="qr-card__body">
        <!-- 创建订单 -->
        <a class="create-order" href="order-create.html" aria-label="创建订单">
          <div class="create-order__text">
            <strong class="create-order__title">创建订单</strong>
            <span class="create-order__sub">快速高效交易安心</span>
          </div>
          <img class="create-order__scan" src="assets/icons/scan.svg" alt="扫码" />
        </a>

        <!-- 功能入口 -->
        <div class="func-row">
          <a class="func-row__item" href="#" aria-label="自产自销证明">
            <svg class="func-row__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path class="func-file__fold" d="M15.2 18.4C15.2 17.5164 15.9163 16.8 16.8 16.8H21.4068C21.4781 16.8 21.5138 16.8862 21.4634 16.9366L15.3365 23.0635C15.2861 23.1139 15.2 23.0782 15.2 23.0069V18.4Z" />

            </svg>
            <span>自产自销证明</span>
          </a>
          <span class="func-row__divider" aria-hidden="true"></span>
          <a class="func-row__item" href="#" aria-label="附近的收购点">
            <svg class="func-row__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path class="func-store__awning" d="M3.91553 3.36889C4.45759 2.28478 5.56563 1.59998 6.7777 1.59998H17.2223C18.4344 1.59998 19.5424 2.28478 20.0844 3.36889L21.8211 6.84221C22.0871 7.37413 21.7003 7.99998 21.1056 7.99998H2.89442C2.29971 7.99998 1.91291 7.37413 2.17887 6.8422L3.91553 3.36889Z" />

              <path class="func-store__body" fill-rule="evenodd" clip-rule="evenodd" d="M3.50802 13.999C2.95605 13.9848 2.40005 14.3735 2.40005 14.9256V19.2001C2.40005 20.9674 3.83274 22.4001 5.60005 22.4001H18.4C20.1674 22.4001 21.6 20.9674 21.6 19.2001V14.9256C21.6 14.3735 21.044 13.9848 20.4921 13.999C20.4614 13.9997 20.4307 14.0001 20.4 14.0001C19.9273 14.0001 19.4592 13.907 19.0224 13.7261C18.5856 13.5452 18.1888 13.28 17.8545 12.9457C17.716 12.8072 17.4841 12.8072 17.3456 12.9457C17.0113 13.28 16.6145 13.5452 16.1777 13.7261C15.7409 13.907 15.2728 14.0001 14.8 14.0001C14.3273 14.0001 13.8592 13.907 13.4224 13.7261C12.9856 13.5452 12.5888 13.28 12.2545 12.9457C12.116 12.8072 11.8841 12.8072 11.7456 12.9457C11.4113 13.28 11.0145 13.5452 10.5777 13.7261C10.1409 13.907 9.67281 14.0001 9.20005 14.0001C8.72729 14.0001 8.25916 13.907 7.82239 13.7261C7.38562 13.5452 6.98875 13.28 6.65446 12.9457C6.51597 12.8072 6.28413 12.8072 6.14563 12.9457C5.81134 13.28 5.41448 13.5452 4.97771 13.7261C4.54094 13.907 4.07281 14.0001 3.60005 14.0001C3.56935 14.0001 3.53867 13.9997 3.50802 13.999ZM10.4 17.6C9.95822 17.6 9.60005 17.9582 9.60005 18.4V20C9.60005 20.4419 9.95822 20.8 10.4 20.8H13.6C14.0419 20.8 14.4 20.4419 14.4 20V18.4C14.4 17.9582 14.0419 17.6 13.6 17.6H10.4Z" />
            </svg>
            <span>附近的收购点</span>
          </a>
        </div>
      </div>
    </section>

    <!-- 集采广告（点击进入集采活动页 jicai.html） -->
    <a class="ad" href="jicai.html" aria-label="集采活动">
      <div class="ad__content">
        <h2 class="ad__title">集采活动报名啦</h2>
        <span class="text-arrow">
          我要参加
          <span class="text-arrow__box" aria-hidden="true">
            <span class="text-arrow__icon text-arrow__icon--lg"></span>
          </span>
        </span>
      </div>
      <img class="ad__img" src="assets/images/ad-megaphone.webp" alt="" />
    </a>

    <!-- 市场行情 -->
    <section class="market" aria-label="农产品收购市场行情">
      <div class="market__head">
        <h2 class="market__title">农产品收购市场行情</h2>
        <span class="market__unit">单位：元/吨</span>
      </div>

      <div class="market__tabs">
        <button class="market__tab market__tab--active" type="button">蚕茧</button>
        <button class="market__tab" type="button">陈皮</button>
        <button class="market__tab" type="button">木材</button>
        <button class="market__tab" type="button">其他</button>
      </div>

      <table class="market__table">
        <thead>
          <tr>
            <th class="market__th market__th--time">时间</th>
            <th class="market__th market__th--region">收购县区</th>
            <th class="market__th market__th--price">收购单价</th>
          </tr>
        </thead>
        <tbody>
          <tr class="market__row market__row--hl">
            <td class="market__time">06-18 15:32</td>
            <td class="market__region">百色市西林县</td>
            <td class="market__price"><span class="market__price-sym">¥</span><span class="market__price-num">345</span></td>
          </tr>
          <tr class="market__row">
            <td class="market__time">06-18 15:18</td>
            <td class="market__region">钦州市灵山县</td>
            <td class="market__price"><span class="market__price-sym">¥</span><span class="market__price-num">522</span></td>
          </tr>
          <tr class="market__row market__row--hl">
            <td class="market__time">06-18 14:12</td>
            <td class="market__region">梧州市藤县</td>
            <td class="market__price"><span class="market__price-sym">¥</span><span class="market__price-num">874</span></td>
          </tr>
          <tr class="market__row">
            <td class="market__time">06-18 13:31</td>
            <td class="market__region">桂林市资源县</td>
            <td class="market__price"><span class="market__price-sym">¥</span><span class="market__price-num">956</span></td>
          </tr>
          <tr class="market__row market__row--hl">
            <td class="market__time">06-18 12:32</td>
            <td class="market__region">百色市右江区</td>
            <td class="market__price"><span class="market__price-sym">¥</span><span class="market__price-num">207</span></td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- 授权条 -->
    <section class="auth" aria-label="数农授权">
      <span class="auth__text">授权银行卡自动收款，享受秒到账便捷服务</span>
      <button class="auth__btn" type="button">立即授权</button>
    </section>
  </main>

  </div><!-- /#page-home -->

  <!-- 底部标签栏（内联，避免 fetch 模板额外请求） -->
  <nav class="tabbar" aria-label="主导航">
    <button class="tabbar__item" type="button" data-page="home">
      <span class="tabbar__icon">
        <img class="tabbar__icon-img tabbar__icon-img--normal" src="assets/icons/tab-home-normal.svg" alt="首页" />
        <img class="tabbar__icon-img tabbar__icon-img--active" src="assets/icons/tab-home-active.svg" alt="首页" />
      </span>
      <span class="tabbar__label">首页</span>
    </button>
    <button class="tabbar__item" type="button" data-page="order">
      <span class="tabbar__icon">
        <img class="tabbar__icon-img tabbar__icon-img--normal" src="assets/icons/tab-order-normal.svg" alt="订单" />
        <img class="tabbar__icon-img tabbar__icon-img--active" src="assets/icons/tab-order-active.svg" alt="订单" />
      </span>
      <span class="tabbar__label">订单</span>
    </button>
    <!-- 中间凸起"亮码卖货"主按钮 -->
    <button class="tabbar__item tabbar__item--main" type="button" data-page="code">
      <span class="tabbar__main-btn">
        <img class="tabbar__main-icon" src="assets/icons/tab-qr.svg" alt="亮码卖货" />
      </span>
      <span class="tabbar__label">亮码卖货</span>
    </button>
    <button class="tabbar__item" type="button" data-page="flow">
      <span class="tabbar__icon">
        <img class="tabbar__icon-img tabbar__icon-img--normal" src="assets/icons/tab-flow-normal.svg" alt="收支" />
        <img class="tabbar__icon-img tabbar__icon-img--active" src="assets/icons/tab-flow-active.svg" alt="收支" />
      </span>
      <span class="tabbar__label">收支</span>
    </button>
    <button class="tabbar__item" type="button" data-page="mine">
      <span class="tabbar__icon">
        <img class="tabbar__icon-img tabbar__icon-img--normal" src="assets/icons/tab-mine-normal.svg" alt="我的" />
        <img class="tabbar__icon-img tabbar__icon-img--active" src="assets/icons/tab-mine-active.svg" alt="我的" />
      </span>
      <span class="tabbar__label">我的</span>
    </button>
  </nav>

  <!-- 公共脚本合并 app.js（defer：并行下载、不阻塞渲染；执行顺序保持依赖关系） -->
  <script src="scripts/app.js" defer></script>
  <script src="scripts/home.js" defer></script>
</body>
</html>
