<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>报名 - 桂农易通</title>
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/jicai.css" />
  <link rel="stylesheet" href="styles/jicai-signup-form.css" />
  <link rel="stylesheet" href="styles/modal.css" />
</head>
<body>
  <div class="jc-page">

    <!-- 顶部绿色渐变头图 -->
    <div class="jc-head" aria-hidden="true"></div>

    <!-- 页头（App Shell Header：od ghost 返回 + 标题"报名" + 微信按钮） -->
    <div class="header-mount" data-header="signup-form"></div>

    <!-- ==================== 滚动内容区（App Shell Container） ==================== -->
    <main class="jc-scroll">

      <!-- 表单卡片 1：拟采购商品 -->
      <section class="jsf-card">

        <!-- 区段标题 -->
        <h2 class="jsf-heading">拟采购商品</h2>

        <!-- ====== 商品 1（bg-2 子卡） ====== -->
        <div class="jsf-product">
          <div class="form__row">
            <div class="form__label">商品规格</div>
            <div class="form__field">
              <span class="jsf-value">大红陈皮</span>
            </div>
          </div>
          <div class="form__row">
            <div class="form__label">参考价格</div>
            <div class="form__field">
              <span class="jsf-value">200.0</span>
              <span class="form__unit">元/公斤</span>
            </div>
          </div>
          <div class="form__row jsf-row--vertical">
            <div class="form__label">拟采购数量</div>
            <div class="form__field">
              <input class="form__input" type="number" inputmode="decimal" placeholder="请输入本次拟采收的数量" />
              <span class="form__unit">千克</span>
            </div>
          </div>
          <div class="form__row">
            <div class="form__label">预计采购金额</div>
            <div class="form__field">
              <span class="jsf-value jsf-value--amount">0.00</span>
              <span class="form__unit">元</span>
            </div>
          </div>
        </div>

        <!-- ====== 商品 2（bg-2 子卡） ====== -->
        <div class="jsf-product">
          <div class="form__row">
            <div class="form__label">商品规格</div>
            <div class="form__field">
              <span class="jsf-value">二红陈皮</span>
            </div>
          </div>
          <div class="form__row">
            <div class="form__label">参考价格</div>
            <div class="form__field">
              <span class="jsf-value">180.0</span>
              <span class="form__unit">元/公斤</span>
            </div>
          </div>
          <div class="form__row jsf-row--vertical">
            <div class="form__label">拟采购数量</div>
            <div class="form__field">
              <input class="form__input" type="number" inputmode="decimal" placeholder="请输入本次拟采收的数量" />
              <span class="form__unit">千克</span>
            </div>
          </div>
          <div class="form__row">
            <div class="form__label">预计采购金额</div>
            <div class="form__field">
              <span class="jsf-value jsf-value--amount">0.00</span>
              <span class="form__unit">元</span>
            </div>
          </div>
        </div>

      </section>

    </main>

    <!-- ==================== 底栏（App Shell 底部操作条）：汇总 + 按钮（同创建订单页结构） ==================== -->
    <footer class="jsf-bottombar">
      <div class="jsf-total">
        <div class="jsf-total__col">
          <span class="jsf-total__label">预计采购总金额</span>
          <span class="jsf-total__num">0.00 元</span>
        </div>
        <div class="jsf-total__col jsf-total__col--right">
          <span class="jsf-total__label">保证金</span>
          <span class="jsf-total__num">0.00 元</span>
        </div>
      </div>
      <button class="btn btn--fill" type="button">确定报名</button>
    </footer>

  </div>

  <!-- Header 组件（顶栏变体4 od ghost：返回 jicai-detail.html + 标题"报名" + 微信按钮） -->
  <!-- ==================== 缴纳保证金弹窗（Figma 1004:10118 缴纳保证金弹窗） ==================== -->
  <div class="modal" id="jsf-modal" aria-hidden="true">
    <div class="modal__mask"></div>
    <div class="modal__card">
      <div class="modal__illust">
        <img src="assets/images/jsf-recharge-img.png" alt="" />
      </div>
      <div class="modal__texts">
        <p class="modal__title modal__title--sub">本次活动需缴纳保证金</p>
        <p class="modal__amount-line">
          <span class="modal__amount">200.0</span><span class="modal__unit">元</span>
        </p>
      </div>
      <div class="modal__actions">
        <button class="btn btn--fill btn--l" type="button" id="jsf-modal-submit">确定缴纳</button>
        <button class="btn btn--outline btn--outline--muted btn--l" type="button" id="jsf-modal-cancel">稍后再说</button>
      </div>
    </div>
    <button class="modal__close" type="button" aria-label="关闭" id="jsf-modal-close">
      <img src="assets/icons/ic-c-191.svg" alt="" />
    </button>
  </div>

  <!-- ==================== 输入密码弹窗 ==================== -->
  <div class="modal" id="jsf-pwd-modal" aria-hidden="true">
    <div class="modal__mask"></div>
    <div class="modal__card modal__card--narrow">
      <div class="modal__texts">
        <p class="modal__title modal__title--sub">请输入支付密码</p>
      </div>
      <div class="jsf-pwd-inputs" id="jsf-pwd-inputs">
        <input class="jsf-pwd-input" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="jsf-pwd-input" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="jsf-pwd-input" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="jsf-pwd-input" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="jsf-pwd-input" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="jsf-pwd-input" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
      </div>
      <div class="modal__actions">
        <button class="btn btn--fill btn--l" type="button" id="jsf-pwd-confirm">确定</button>
        <button class="btn btn--outline btn--outline--muted btn--l" type="button" id="jsf-pwd-cancel">取消</button>
      </div>
    </div>
  </div>

  <script src="scripts/modal.js"></script>
  <script>
    Modal.mount('#jsf-modal');
    Modal.mount('#jsf-pwd-modal');

    // 点击"确定报名"按钮 → 打开保证金弹窗
    document.querySelector('.jsf-bottombar .btn--fill').addEventListener('click', function (e) {
      e.preventDefault();
      Modal.open('#jsf-modal');
    });

    // 稍后再说（取消 → 仅关闭）
    document.getElementById('jsf-modal-cancel').addEventListener('click', function () {
      Modal.close('#jsf-modal');
    });

    // 确定缴纳 → 关闭保证金弹窗，打开密码弹窗
    document.getElementById('jsf-modal-submit').addEventListener('click', function () {
      Modal.close('#jsf-modal');
      openPwdModal();
    });

    // ========== 密码输入弹窗逻辑 ==========
    var pwdInputs = document.querySelectorAll('#jsf-pwd-inputs .jsf-pwd-input');

    function openPwdModal() {
      // 清空并重置
      pwdInputs.forEach(function (input) { input.value = ''; });
      Modal.open('#jsf-pwd-modal');
      // 聚焦第一个输入框
      setTimeout(function () { pwdInputs[0].focus(); }, 100);
    }

    // 密码输入：自动跳转下一个 / 退格跳回上一个
    pwdInputs.forEach(function (input, idx) {
      input.addEventListener('input', function () {
        if (this.value && idx < pwdInputs.length - 1) {
          pwdInputs[idx + 1].focus();
        }
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !this.value && idx > 0) {
          pwdInputs[idx - 1].focus();
        }
      });
    });

    // 确定 → 模拟验证，跳转成功页
    document.getElementById('jsf-pwd-confirm').addEventListener('click', function () {
      Modal.close('#jsf-pwd-modal');
      location.href = 'jicai-signup-deposit-success.html';
    });

    // 取消 → 关闭密码弹窗
    document.getElementById('jsf-pwd-cancel').addEventListener('click', function () {
      Modal.close('#jsf-pwd-modal');
    });
  </script>

    <script src="scripts/topbar.js"></script>
  <script src="scripts/page-header.js"></script>
  <script src="scripts/wechat-button.js"></script>
  <script>
  PageHeader.mount({
    container: document.querySelector('[data-header="signup-form"]'),
    topbar: { variant: 'od', title: '报名', right: 'wechat', ghost: true }
  });
  // 返回 → 集采活动详情页
  document.querySelector('.od-topbar__back').setAttribute('href', 'jicai-detail.html');
  </script>
</body>
</html>
