<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>集采活动管理 - 桂农易通</title>
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/jicai.css" />
  <link rel="stylesheet" href="styles/jicai-manage.css" />
</head>
<body>
  <!-- ==================== App Shell 模式：Header + Container ==================== -->
  <div class="jm-page">

    <!-- Header 组件挂载点（PageHeader.mount 生成 .page-header，flex-shrink:0 锁定顶部） -->
    <div class="header-mount"></div>

    <!-- ==================== 筛选栏（新变体 jmf-*，Figma 1076:43426：商品品类输入 + 分割线 + 标签栏） ==================== -->
    <div class="jmf-filter">
      <!-- 商品品类输入（pill 50px、padding 4、后置下拉箭头；点击弹出品类下拉菜单） -->
      <div class="jmf-input" role="button" aria-label="选择商品品类" aria-haspopup="listbox" aria-expanded="false" id="jmf-category">
        <span class="jmf-input__text" id="jmf-category-text">商品品类</span>
        <span class="jmf-input__arrow" aria-hidden="true"></span>
        <!-- 下拉菜单（默认隐藏）：全部 / 陈皮 / 原木 / 蚕茧 -->
        <ul class="jmf-menu" role="listbox" id="jmf-menu" hidden>
          <li class="jmf-menu__item" role="option" data-cat="all">全部</li>
          <li class="jmf-menu__item" role="option" data-cat="chenpi">陈皮</li>
          <li class="jmf-menu__item" role="option" data-cat="mu">原木</li>
          <li class="jmf-menu__item" role="option" data-cat="canjian">蚕茧</li>
        </ul>
      </div>
      
      <!-- 标签栏（横向可滚动） -->
      <div class="jmf-tabs">
        <button class="jmf-tab is-active" type="button" data-tab="all">全部<span class="jmf-tab__count">0</span></button>
        <button class="jmf-tab" type="button" data-tab="enrolled">已报名<span class="jmf-tab__count">0</span></button>
        <button class="jmf-tab" type="button" data-tab="in_progress">履约中<span class="jmf-tab__count">0</span></button>
        <button class="jmf-tab" type="button" data-tab="done">已完成<span class="jmf-tab__count">0</span></button>
      </div>
    </div>

    <!-- ==================== 内容区 Container（flex:1 内部滚动） ==================== -->
    <main class="jm-scroll">
      <div class="jm-list" id="jm-list">
        <!-- 活动卡片由 JS 动态渲染（复用 jc-card 样式） -->
      </div>
    </main>

  </div>

  <script src="scripts/topbar.js"></script>
  <script src="scripts/page-header.js"></script>
  <script src="scripts/wechat-button.js"></script>
  <script>
  // 返回
  document.addEventListener('DOMContentLoaded', function () {
    var back = document.querySelector('.od-topbar__back');
    if (back) {
      back.addEventListener('click', function (e) {
        e.preventDefault();
        if (history.length > 1) history.back(); else location.href = 'index.html';
      });
    }
  });

  // 页头：变体 od 浅色（筛选栏由页面自行构建，不复用 PageHeader.filter）
  PageHeader.mount({
    container: document.querySelector('.header-mount'),
    topbar: {
      variant: 'od',
      title: '集采活动管理',
      right: 'wechat',
      left: { type: 'back', href: 'index.html' }
    }
  });

  // 状态配置（标签文字、标签背景、标签文字色、按钮内容）
  var STATUS_CFG = {
    deposit:     { label: '保证金待缴', bg: '#FFEDD5', color: '#F97316', btn: '' },
    enrolled:    { label: '已报名',     bg: '#DCFCE7', color: '#16A34A', btn: '取消报名' },
    in_progress: { label: '履约中',     bg: '#DBEAFE', color: '#3B82F6', btn: '订单查看' },
    done:        { label: '已完成',     bg: '#F3F4F6', color: '#9CA3AF', btn: '' }
  };

  // 模拟活动数据（Figma 1076:43228 卡片：商品图 + 名称 + 产品规格 + 参考价格 + 截止时间 + 状态标签）
  var activities = [
    { name: '大红 / 5年 /A级', status: 'deposit',     spec: '5年 /A级', price: '300.00', unit: 'kg', deadline: '2026-10-20' },
    { name: '大红 / 5年 /A级', status: 'enrolled',    spec: '5年 /A级', price: '300.00', unit: 'kg', deadline: '2026-10-20' },
    { name: '大红 / 5年 /A级', status: 'in_progress', spec: '5年 /A级', price: '300.00', unit: 'kg', deadline: '2026-10-20' },
    { name: '大红 / 5年 /A级', status: 'done',        spec: '5年 /A级', price: '300.00', unit: 'kg', deadline: '2026-10-20' }
  ];

  function renderList(filter) {
    var list = document.getElementById('jm-list');
    var filtered = filter === 'all' ? activities : activities.filter(function (a) { return a.status === filter; });
    list.innerHTML = filtered.map(function (a) {
      var s = STATUS_CFG[a.status];
      var btnHtml = s.btn
        ? '<button class="jmc-btn-cancel" type="button">' + s.btn + '</button>'
        : '';
      return '<article class="jmc-card">' +
        '<span class="jmc-tag" style="background:' + s.bg + ';color:' + s.color + '">' + s.label + '</span>' +
        '<div class="jmc-body">' +
          '<div class="jmc-thumb"><img class="jmc-thumb__img" src="assets/jicai-goods.webp" alt="' + a.name + '" /></div>' +
          '<div class="jmc-info">' +
            '<p class="jmc-name">' + a.name + '</p>' +
            '<div class="jmc-row">' +
              '<span class="jmc-row__label">产品规格: </span>' +
              '<span class="jmc-row__value">' + a.spec + '</span>' +
            '</div>' +
            '<div class="jmc-row">' +
              '<span class="jmc-row__label">参考价格: </span>' +
              '<span class="jmc-row__price">' +
                '<span class="jmc-row__sym">¥</span>' +
                '<span class="jmc-row__num">' + a.price + '</span>' +
                '<span class="jmc-row__unit">元/' + a.unit + '</span>' +
              '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="jmc-foot">' +
          '<div class="jmc-deadline">' +
            '<span class="jmc-deadline__label">活动截止时间:</span>' +
            '<span class="jmc-deadline__date">' + a.deadline + '</span>' +
          '</div>' +
          btnHtml +
          '<span class="jmc-arrow" aria-hidden="true"></span>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  renderList('all');

  // 商品品类下拉菜单：点击切换显隐，选择后回填文字并收起
  (function () {
    var input = document.getElementById('jmf-category');
    var menu = document.getElementById('jmf-menu');
    var textEl = document.getElementById('jmf-category-text');
    if (!input || !menu || !textEl) return;

    function toggle(open) {
      menu.hidden = !open;
      input.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    input.addEventListener('click', function (e) {
      e.stopPropagation();
      toggle(menu.hidden);
    });

    menu.addEventListener('click', function (e) {
      var item = e.target.closest('.jmf-menu__item');
      if (!item) return;
      textEl.textContent = item.textContent;
      toggle(false);
    });

    // 点击其他区域关闭
    document.addEventListener('click', function () {
      toggle(false);
    });
  })();

  // 标签切换筛选（新变体 jmf-tab）
  document.addEventListener('click', function (e) {
    var tab = e.target.closest('.jmf-tab');
    if (!tab) return;
    document.querySelectorAll('.jmf-tab').forEach(function (b) {
      b.classList.toggle('is-active', b === tab);
    });
    renderList(tab.dataset.tab);
  });
  </script>
</body>
</html>
