<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>集采订单详情 - 桂农易通</title>
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/jicai-order-detail.css" />
</head>
<body>
  <!-- ==================== App Shell：Header + Container ==================== -->
  <div class="jod-page">

    <!-- Header 挂载点（od 二级页头） -->
    <div class="header-mount"></div>

    <!-- ==================== 内容区 Container ==================== -->
    <main class="jod-scroll" id="jod-scroll">
      <!-- 订单详情由 JS 渲染 -->
    </main>

  </div>

  <script src="scripts/topbar.js"></script>
  <script src="scripts/page-header.js"></script>
  <script src="scripts/wechat-button.js"></script>
  <script>
  PageHeader.mount({
    container: document.querySelector('.header-mount'),
    topbar: { variant: 'od', title: '集采订单详情', right: 'wechat', left: { type: 'back', href: 'jicai-order.html' } }
  });

  // 模拟订单数据（与列表页一致）
  var orders = [
    { id: 1, no: 'JC202610200001', seller: '广西农资代采服务有限公司', createdAt: '2026-10-20 09:30:00', activity: '2026 浦北陈皮秋采定点采购活动', category: '柑皮（陈皮原料）', spec: '大红 / 5年 / A级', price: '300.00', weight: '166.67', amount: '50000.00' },
    { id: 2, no: 'JC202610200002', seller: '广西农资代采服务有限公司', createdAt: '2026-10-20 10:15:00', activity: '2026 浦北陈皮秋采定点采购活动', category: '柑皮（陈皮原料）', spec: '大红 / 5年 / A级', price: '300.00', weight: '106.67', amount: '32000.00' },
    { id: 3, no: 'JC202610200003', seller: '广西农资代采服务有限公司', createdAt: '2026-10-20 11:00:00', activity: '2026 浦北陈皮秋采定点采购活动', category: '柑皮（陈皮原料）', spec: '二红 / 3年 / B级', price: '280.00', weight: '102.14', amount: '28600.00' },
    { id: 4, no: 'JC202610200004', seller: '广西农资代采服务有限公司', createdAt: '2026-10-20 13:20:00', activity: '2026 浦北陈皮秋采定点采购活动', category: '柑皮（陈皮原料）', spec: '大红 / 3年 / A级', price: '320.00', weight: '48.13', amount: '15400.00' },
    { id: 5, no: 'JC202610200005', seller: '广西农资代采服务有限公司', createdAt: '2026-10-20 14:45:00', activity: '2026 浦北陈皮秋采定点采购活动', category: '柑皮（陈皮原料）', spec: '二红 / 2年 / B级', price: '200.00', weight: '48.00', amount: '9600.00' }
  ];

  // 从 URL 取 id
  var id = Number(new URLSearchParams(location.search).get('id')) || 1;
  var order = orders.filter(function (o) { return o.id === id; })[0] || orders[0];

  document.getElementById('jod-scroll').innerHTML =
    // 订单信息
    '<section class="jod-card">' +
      '<h2 class="jod-card__title">订单信息</h2>' +
      '<div class="jod-rows">' +
        '<div class="jod-row"><span class="jod-row__label">订单编号</span><span class="jod-row__value jod-row__value--num">' + order.no + '</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">买方</span><span class="jod-row__value">本人</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">卖方</span><span class="jod-row__value">' + order.seller + '</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">订单创建时间</span><span class="jod-row__value">' + order.createdAt + '</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">关联报名记录</span><span class="jod-row__value">' + order.activity + '</span></div>' +
      '</div>' +
    '</section>' +
    // 商品明细
    '<section class="jod-card">' +
      '<h2 class="jod-card__title">商品明细</h2>' +
      '<div class="jod-rows">' +
        '<div class="jod-row"><span class="jod-row__label">商品品类</span><span class="jod-row__value">' + order.category + '</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">商品规格</span><span class="jod-row__value">' + order.spec + '</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">商品单价</span><span class="jod-row__value jod-row__value--amount">¥' + order.price + '<span class="jod-row__unit"> 元/kg</span></span></div>' +
        '<div class="jod-row"><span class="jod-row__label">商品重量</span><span class="jod-row__value">' + order.weight + ' kg</span></div>' +
        '<div class="jod-row"><span class="jod-row__label">总金额</span><span class="jod-row__value jod-row__value--amount">¥' + order.amount + '</span></div>' +
      '</div>' +
    '</section>' +
    // 合同
    '<section class="jod-card jod-contract">' +
      '<h2 class="jod-card__title">合同</h2>' +
      '<button class="text-arrow text-arrow--primary" type="button">查看合同<span class="text-arrow__icon" aria-hidden="true"></span></button>' +
    '</section>' +
    '<div class="jod-safe-bottom"></div>';
  </script>
</body>
</html>
