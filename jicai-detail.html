<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>集采活动详情 - 桂农易通</title>
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/jicai-detail.css" />
</head>
<body>
  <!-- ==================== Full Scroll（首页模式，DESIGN.md §1.2）：Hero 商品图 + 内容区滚动 ==================== -->

  <!-- Hero 商品图（Figma 1015:11273：375×375 深绿渐变 #16A34A→#EBF2FC + 陈皮商品图，圆角4） -->
  <div class="jd-hero">
    <img class="jd-hero__img" src="assets/images/jicai-detail-product.png" alt="2026 浦北陈皮秋采定点采购活动" />
  </div>

  <!-- 页头（Header 组件：od 顶栏暗色变体 dark:true，absolute 悬浮于 Hero 顶部，不被 Hero 圆角裁切） -->
  <div class="header-mount"></div>

  <!-- ==================== 滚动内容区（说明卡 + 表单卡） ==================== -->
  <main class="jd-body">

    <!-- 说明卡（绿底 #16A34A 圆角8 padding16：左右分栏，左截止日期 + 右翻牌倒计时） -->
    <section class="jd-notice" aria-label="报名截止与倒计时">
      <!-- 左：报名截止日期 -->
      <div class="jd-notice__col">
        <span class="jd-notice__label">报名截止日期</span>
        <span class="jd-notice__date">2026-04-18</span>
      </div>
      <!-- 右：剩余时间 · 翻牌器样式倒计时（DD:HH:MM:SS） -->
      <div class="jd-notice__col jd-notice__col--right">
        <span class="jd-notice__label">剩余时间</span>
        <div class="jd-countdown">
          <span class="jd-flip">03</span>
          <span class="jd-flip__sep">:</span>
          <span class="jd-flip">12</span>
          <span class="jd-flip__sep">:</span>
          <span class="jd-flip">45</span>
          <span class="jd-flip__sep">:</span>
          <span class="jd-flip">30</span>
        </div>
      </div>
    </section>

    <!-- 表单卡（Figma 1007:10488：白底圆角8 padding16） -->
    <section class="jd-card">
      <!-- 活动大标题（中文5级标题 20/630 居中） -->
      <h2 class="jd-card__title">2026 浦北陈皮秋采定点采购活动</h2>

      <!-- 金额区（Figma 1007:10489：标签行居中 + 200.0 西文1级标题 64 绿） -->
      <div class="jd-price">
        <div class="jd-price__label">参考价格<span class="jd-price__unit">(公斤元)</span></div>
        <div class="jd-price__num">200.0</div>
      </div>

      <!-- 属性行（商品品类、商品规格、产地） -->
      <div class="jd-rows">
        <div class="form__row jd-row">
          <div class="form__label">商品品类</div>
          <div class="form__field">
            <span class="jd-row__value">柑皮（陈皮原料）</span>
          </div>
        </div>

        <div class="form__row jd-row">
          <div class="form__label">商品规格</div>
          <div class="form__field">
            <span class="jd-row__value">50 公斤/袋</span>
          </div>
        </div>

        <div class="form__row jd-row">
          <div class="form__label">产地</div>
          <div class="form__field">
            <span class="jd-row__value">广西浦北县龙门镇</span>
          </div>
        </div>
      </div>

      </section>

    <!-- 活动详情卡：独立白底卡片，图文混排 -->
    <section class="jd-detail">
      <h3 class="jd-detail__heading">活动详情</h3>
      <div class="jd-detail__body">
        <p class="jd-detail__text">本次活动面向浦北县及周边产区农户，定点采购 2026 年秋采大红/二红柑皮，用于陈皮加工生产。要求果皮完整、无霉变、干爽无杂。</p>
        <img class="jd-detail__image" src="assets/images/jicai-detail-product.png" alt="陈皮原料示意" />
        <p class="jd-detail__text">采购方将提供现场技术指导，协助农户进行分级分拣。合格产品当日签约、当日结算。</p>
        <p class="jd-detail__text">参与农户需提前报名，经审核后获得供货资格。</p>
        <!-- 说明卡（Figma 1007:10513：浅绿底 #F0FDF4 + 绿描边 #BBF7D0 1px + 圆角8，标题行居中） -->
        <div class="jd-note">
          <div class="jd-note__head">
            <span class="jd-note__icon" aria-hidden="true"></span>
            <span class="jd-note__title">说明</span>
          </div>
          <p class="jd-note__text">如果您现在可以提供以上货物，请与我们联系，感谢您的关注。</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== 底部固定操作栏（确定报名） ==================== -->
  <footer class="jd-bottombar">
    <button class="btn-fill" type="button" onclick="location.href='jicai-signup-form.html'">确定报名</button>
  </footer>

  <script src="scripts/topbar.js"></script>
  <script src="scripts/page-header.js"></script>
  <script src="scripts/wechat-button.js"></script>
  <script src="scripts/full-scroll-header.js"></script>
  <script>
  // Full Scroll 页头：od 顶栏暗色变体（dark:true），白字悬浮于深色 Hero 上
  PageHeader.mount({
    container: document.querySelector('.header-mount'),
    topbar: {
      variant: 'od',
      title: '集采活动详情',
      right: 'wechat',
      dark: true,
      left: { type: 'back', href: 'jicai-signup.html' }
    }
  });

  // Full Scroll 吸顶（组件封装，@see scripts/full-scroll-header.js）
  FullScrollHeader.mount({
    headerEl: '.header-mount',
    heroEl: '.jd-hero'
  });
  </script>
</body>
</html>
